ext.SplashMotion = [
  minSdkVersion: 24,
  compileSdkVersion: 36
]

ext.getExtOrDefault = { prop ->
  if (rootProject.ext.has(prop)) {
    return rootProject.ext.get(prop)
  }

  return SplashMotion[prop]
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

// Pick the renderer from the config generated by `npx splash-motion generate`,
// so apps only ship the runtime they actually use (Lottie OR Rive).
def splashMotionRenderer() {
  def override = rootProject.findProperty("SplashMotion_renderer")
  if (override) return override.toString()
  def config = rootProject.file("app/src/main/assets/splashmotion/config.json")
  if (!config.exists()) return "lottie"
  def json = new groovy.json.JsonSlurper().parse(config)
  return json.type == "rive" ? "rive" : "lottie"
}

def renderer = splashMotionRenderer()

apply plugin: "com.android.library"

if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}

apply from: '../nitrogen/generated/android/splashmotion+autolinking.gradle'

apply plugin: "com.facebook.react"

android {
  namespace "com.margelo.nitro.splashmotion"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
    consumerProguardFiles "proguard-rules.pro"

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters (*reactNativeArchitectures())

        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }
  }

  if (rootProject.ext.has("ndkVersion")) {
    ndkVersion rootProject.ext.ndkVersion
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  packaging {
    resources {
      excludes += [
        "META-INF",
        "META-INF/**"
      ]
    }

    jniLibs {
      excludes += [
        "**/libc++_shared.so",
        "**/libfbjni.so",
        "**/libjsi.so",
        "**/libfolly_json.so",
        "**/libfolly_runtime.so",
        "**/libglog.so",
        "**/libhermes.so",
        "**/libreactnative.so"
      ]
    }
  }

  buildFeatures {
    prefab true
  }

  sourceSets {
    main {
      java.srcDirs += ["src/${renderer}/java"]
    }
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation project(":react-native-nitro-modules")
  implementation "androidx.core:core-splashscreen:1.0.1"

  if (renderer == "rive") {
    implementation "app.rive:rive-android:11.10.0"
  } else {
    implementation "com.airbnb.android:lottie:6.7.1"
  }
}
