name: Release

# Publishes to npm when a version tag is pushed, e.g. `git tag v0.1.3 && git push origin v0.1.3`.
# The tag must match the version in package.json and point at a commit on main.
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write # create the GitHub release
      id-token: write # npm provenance (and trusted publishing)

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify the tag matches package.json and is on main
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          if ! git branch -r --contains "$GITHUB_SHA" | grep -qx '  origin/main'; then
            echo "::error::Tag $GITHUB_REF_NAME is not on origin/main"
            exit 1
          fi

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build package
        run: yarn prepare

      - name: Check the package contents
        run: |
          npm pack --dry-run --json --ignore-scripts 2>/dev/null | node -e "
            let out = '';
            process.stdin.on('data', (d) => (out += d)).on('end', () => {
              const files = JSON.parse(out)[0].files.map((f) => f.path);
              const required = [
                'lib/module/index.js',
                'lib/cli/index.js',
                'lib/plugin/index.js',
                'app.plugin.js',
                'nitro.json',
              ];
              const missing = required.filter((f) => !files.includes(f));
              const leaked = files.filter((f) => /__tests__|vitest/.test(f));
              if (missing.length || leaked.length) {
                console.error('Missing from the package:', missing);
                console.error('Should not be published:', leaked);
                process.exit(1);
              }
              console.log('Package contents OK (' + files.length + ' files)');
            });
          "

      - name: Publish to npm
        run: |
          tag=latest
          # Pre-releases (e.g. 0.2.0-beta.1) must not become the default install.
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; esac
          npm publish --provenance --access public --tag "$tag"
        env:
          # Not needed if the package uses npm trusted publishing (OIDC).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag $flags
        env:
          GH_TOKEN: ${{ github.token }}
