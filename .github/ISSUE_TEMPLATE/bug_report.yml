name: 🐛 Bug report
description: Report a reproducible bug or regression in this library.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        # Bug report

        👋 Hi!

        **Please fill the following carefully before opening a new issue ❗**
        *(Your issue may be closed if it doesn't provide the required pieces of information)*
  - type: checkboxes
    attributes:
      label: Before submitting a new issue
      description: Please perform simple checks first.
      options:
        - label: I tested using the latest version of the library, as the bug might be already fixed.
          required: true
        - label: I tested using a [supported version](https://github.com/reactwg/react-native-releases/blob/main/docs/support.md) of react native.
          required: true
        - label: I checked for possible duplicate issues, with possible answers.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: |
        Provide a clear and concise description of what the bug is.
        If needed, you can also provide other samples: error messages / stack traces, screenshots, gifs, etc.
    validations:
      required: true
  - type: input
    id: library-version
    attributes:
      label: Library version
      description: What version of the library are you using?
      placeholder: "x.x.x"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where does the bug happen?
      options:
        - iOS
        - Android
        - Both
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: Project setup
      description: How is your app built?
      options:
        - Bare React Native (CLI)
        - Expo (prebuild / EAS Build)
        - Expo development build (expo-dev-client)
    validations:
      required: true
  - type: dropdown
    id: build-type
    attributes:
      label: Build type and device
      description: Splash timing differs a lot between these, so please be specific.
      options:
        - Release build on a real device
        - Debug build on a real device
        - Release build on a simulator / emulator
        - Debug build on a simulator / emulator
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`npx splash-motion doctor` output"
      description: Run it from your app's root folder and paste the result. It checks that the splash is wired up correctly on both platforms.
      render: shell
    validations:
      required: true
  - type: textarea
    id: react-native-info
    attributes:
      label: Environment info
      description: Run `react-native info` in your terminal and paste the results here.
      render: shell
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: |
        You must provide a clear list of steps and code to reproduce the problem.
      value: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: reproducible-example
    attributes:
      label: Reproducible example repository 
      description: Please provide a link to a repository on GitHub with a reproducible example.
    validations:
      required: true
